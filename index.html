<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATOM / SOL Tracker</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --muted: #8b949e;
      --primary: #58a6ff;
      --accent: #238636;
      --accent-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group {
      display: flex;
      width: 100%;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
      white-space: nowrap;
    }

    .title-group h1 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-bright);
      margin: 0;
    }

    .symbol-button {
      padding: 2px 4px;
      font: inherit;
      color: inherit;
      background: transparent;
      border-color: transparent;
      border-bottom: 1px dashed var(--muted);
      border-radius: 3px;
    }

    .symbol-button:focus-visible { outline: 2px solid var(--primary); }

    .symbol-editor {
      margin: -8px 0 20px;
      font-size: 0.85rem;
    }

    .symbol-editor[hidden] { display: none; }

    .symbol-editor-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .symbol-editor input {
      width: 140px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-bright);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .symbol-editor input:focus { outline: 2px solid var(--primary); }
    .symbol-editor button:disabled { opacity: 0.6; cursor: wait; }
    .symbol-message { margin-top: 8px; color: var(--muted); }
    .symbol-message.error { color: #f85149; }

    .current-rate,
    .inverse-rate {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #8b949e;
    }

    .rate-separator {
      color: #8b949e;
      font-size: 0.9rem;
    }

    .sub-prices {
      font-size: 0.9rem;
      color: #8b949e;
    }

    .amount-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .amount-control input {
      width: 76px;
      padding: 4px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-bright);
      font: inherit;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .amount-control input::-webkit-inner-spin-button,
    .amount-control input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .amount-control input:focus { outline: 2px solid var(--primary); }

    .arrow {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1;
    }

    .arrow.up { color: #3fb950; }
    .arrow.down { color: #f85149; }
    .arrow.flat { color: #ffd700; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .legend-line {
      width: 18px;
      height: 2px;
      border-radius: 1px;
    }

    .legend-line.current { background-color: #ffd700; }
    .legend-line.average { background-color: #2ea043; }

    button {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--primary);
      color: var(--text-bright);
    }

    button.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #000;
      font-weight: bold;
    }

    .chart-box {
      position: relative;
      height: 400px;
      width: 100%;
    }

    .price-charts {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .price-card {
      flex: 1 1 0;
      min-width: 0;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .price-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .price-card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .price-card-value {
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .price-card.atom h2 { color: #2ea043; }
    .price-card.atom .price-card-value { color: #2ea043; }
    .price-card.sol h2 { color: #bc8cff; }
    .price-card.sol .price-card-value { color: #bc8cff; }

    .price-chart-box {
      position: relative;
      height: 200px;
      width: 100%;
    }

    .loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(14, 17, 23, 0.85);
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1><button type="button" class="symbol-button" id="baseSymbol" title="Zmień symbol przeliczanej waluty" aria-label="Zmień symbol przeliczanej waluty" aria-controls="symbolEditor" aria-expanded="false">ATOM</button> / <button type="button" class="symbol-button" id="quoteSymbol" title="Zmień symbol waluty docelowej" aria-label="Zmień symbol waluty docelowej" aria-controls="symbolEditor" aria-expanded="false">SOL</button></h1>
        <div class="current-rate" id="currentRate">Ładowanie...</div>
        <span class="rate-separator">|</span>
        <div class="inverse-rate" id="inverseRate">Ładowanie...</div>
        <span class="rate-separator">|</span>
        <div class="sub-prices" id="subPrices">ATOM: $-- | SOL: $--</div>
        <label class="amount-control" for="conversionAmount">
          <span id="amountLabel">Ilość ATOM</span>
          <input id="conversionAmount" type="number" min="0" step="any" value="1" inputmode="decimal" />
        </label>
      </div>
    </div>

    <form class="symbol-editor" id="symbolEditor" hidden>
      <div class="symbol-editor-controls">
        <label for="symbolInput" id="symbolLabel">Nowy symbol:</label>
        <input id="symbolInput" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="symbolMessage" required />
        <button type="submit" id="symbolSave">Zapisz</button>
        <button type="button" id="symbolCancel">Anuluj</button>
      </div>
      <p class="symbol-message" id="symbolMessage" role="status" aria-live="polite">Wpisz symbol, np. BTC. Wymagany aktywny rynek w USDC na Binance.</p>
    </form>

    <!-- Przyciski interwałów -->
    <div class="toolbar">
      <div class="btn-group" id="intervals">
        <button data-tf="1h">1h</button>
        <button data-tf="4h">4h</button>
        <button data-tf="8h">8h</button>
        <button data-tf="24h" class="active">24h</button>
        <button data-tf="7d">7d</button>
        <button data-tf="30d">30d</button>
        <button data-tf="6m">6m</button>
        <button data-tf="1y">1y</button>
      </div>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-line current"></span>aktualne ratio</span>
        <span class="legend-item"><span class="legend-line average"></span>średnie ratio w zakresie</span>
      </div>
    </div>

    <div class="chart-box">
      <div class="loader" id="loader">Pobieranie danych z rynku...</div>
      <canvas id="ratioChart"></canvas>
    </div>

    <div class="price-charts">
      <div class="price-card atom">
        <div class="price-card-head">
          <h2 id="basePriceTitle">ATOM / USDC</h2>
          <div class="price-card-value" id="atomPrice">$--</div>
        </div>
        <div class="price-chart-box">
          <canvas id="atomChart"></canvas>
        </div>
      </div>
      <div class="price-card sol">
        <div class="price-card-head">
          <h2 id="quotePriceTitle">SOL / USDC</h2>
          <div class="price-card-value" id="solPrice">$--</div>
        </div>
        <div class="price-chart-box">
          <canvas id="solChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Konfiguracja pobierania danych Binance dla wybranego zakresu
    const TIMEFRAMES = {
      '1h':  { interval: '1m',  limit: 60 },
      '4h':  { interval: '3m',  limit: 80 },
      '8h':  { interval: '5m',  limit: 96 },
      '24h': { interval: '15m', limit: 96 },
      '7d':  { interval: '2h',  limit: 84 },
      '30d': { interval: '6h',  limit: 120 },
      '6m':  { interval: '1d',  limit: 180 },
      '1y':  { interval: '1d',  limit: 365 }
    };

    const PAIR_STORAGE_KEY = 'crypto-tracker.pair.v1';
    const validSymbol = (symbol) => typeof symbol === 'string' && /^[A-Z0-9]{1,20}$/.test(symbol);

    function readSavedPair() {
      try {
        const saved = JSON.parse(localStorage.getItem(PAIR_STORAGE_KEY));
        if (saved && validSymbol(saved.base) && validSymbol(saved.quote)) return saved;
      } catch (_) { /* Przeglądarka może blokować dostęp do pamięci. */ }
      return { base: 'ATOM', quote: 'SOL' };
    }

    let selectedPair = readSavedPair();
    let activeTf = '24h';
    let chartInstance = null;
    let atomChartInstance = null;
    let solChartInstance = null;
    let loadRequest = 0;
    const primaryDatasetIndex = 0;

    // Żywy kurs z tickera Binance. Żółta linia na wykresie pokazuje tę
    // wartość, a nie close ostatniej świecy, który przy interwałach dobowych
    // może być sprzed wielu godzin.
    let currentRatio = null;

    function parseClose(value) {
      if (value === null || value === undefined || value === '') return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function parseTimestamp(value) {
      const parsed = Number(value);
      if (!Number.isSafeInteger(parsed) || parsed <= 0) return null;
      const date = new Date(parsed);
      return Number.isFinite(date.getTime()) ? parsed : null;
    }

    function lastValidValue(values) {
      for (let index = values.length - 1; index >= 0; index--) {
        if (Number.isFinite(values[index]) && values[index] > 0) return values[index];
      }
      return null;
    }

    // Zwraca posortowane pozycje X zajęte przez serię w paśmie Y.
    // Uwzględnia też odcinki linii między punktami, bo sama siatka punktów
    // jest zbyt rzadka, żeby wykryć stromo opadający fragment w paśmie.
    function collectOccupiedX(points, validData, bandTop, bandBottom) {
      const occupied = [];
      let previous = null;

      for (let index = 0; index < points.length; index++) {
        const point = points[index];
        const value = Number(validData[index]);
        const isValid = point && Number.isFinite(point.x) && Number.isFinite(value) && value > 0;

        if (!isValid) {
          previous = null;
          continue;
        }

        if (point.y >= bandTop && point.y <= bandBottom) {
          occupied.push(point.x);
        }

        if (previous) {
          const spanX = point.x - previous.x;
          const spanY = point.y - previous.y;
          const steps = Math.max(1, Math.ceil(Math.max(Math.abs(spanX), Math.abs(spanY)) / 3));
          for (let step = 1; step < steps; step++) {
            const ratio = step / steps;
            const sampleX = previous.x + spanX * ratio;
            const sampleY = previous.y + spanY * ratio;
            if (sampleY >= bandTop && sampleY <= bandBottom) {
              occupied.push(sampleX);
            }
          }
        }

        previous = { x: point.x, y: point.y };
      }

      return occupied.sort((left, right) => left - right);
    }

    // Domyślnie środek wykresu; gdy okno etykiety zachodzi na serię,
    // szuka najbliższej pozycji wolnej. Zwraca null, gdy nie ma miejsca.
    function findLabelX(occupied, labelWidth, chartArea) {
      const half = labelWidth / 2;
      const centerX = (chartArea.left + chartArea.right) / 2;
      const minCenter = chartArea.left + half;
      const maxCenter = chartArea.right - half;
      if (minCenter > maxCenter) return null;

      const isBlocked = (candidate) => {
        const from = candidate - half;
        const to = candidate + half;
        return occupied.some((x) => x >= from - 4 && x <= to + 4);
      };

      if (!isBlocked(centerX)) return centerX;

      let bestX = null;
      let bestDistance = Infinity;

      for (let candidate = minCenter; candidate <= maxCenter; candidate += 4) {
        if (isBlocked(candidate)) continue;
        const distance = Math.abs(candidate - centerX);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestX = candidate;
        }
      }

      return bestX;
    }

    // Kierunek ostatniej świecy: open vs close z ostatniego k-line'a.
    // Zwraca 'up', 'down' albo null, gdy brakuje poprawnych danych.
    function lastCandleDirection(klines) {
      for (let index = klines.length - 1; index >= 0; index--) {
        const kline = klines[index];
        if (!kline) continue;
        const open = parseClose(kline[1]);
        const close = parseClose(kline[4]);
        if (open === null || close === null) continue;
        if (close > open) return 'up';
        if (close < open) return 'down';
        return null;
      }
      return null;
    }

    // Ceny poniżej $10 dostają cztery miejsca po przecinku, powyżej dwa.
    function formatUsd(value) {
      return value < 10 ? value.toFixed(4) : value.toFixed(2);
    }

    // Małe kursy innych par również muszą pozostać czytelne.
    function formatRatio(value) {
      if (!Number.isFinite(value) || value <= 0) return '--';
      return value < 0.001 ? Number(value.toPrecision(4)).toString() : value.toFixed(4);
    }

    function directionArrow(direction) {
      if (direction === 'up') return { text: '↑', className: 'up' };
      if (direction === 'down') return { text: '↓', className: 'down' };
      return { text: '→', className: 'flat' };
    }

    // Skala dobowa pokazuje godzinę i minutę, tygodniowa/miesięczna datę
    // z godziną, a roczna sam miesiąc z rokiem.
    function formatTimestamp(timestamp, tfKey) {
      const date = new Date(timestamp);
      if (tfKey === '1h' || tfKey === '4h' || tfKey === '8h' || tfKey === '24h') {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      if (tfKey === '1y') {
        return date.toLocaleDateString([], { month: 'short', year: '2-digit' });
      }
      if (tfKey === '6m') {
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }
      return date.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    const currentRateEl = document.getElementById('currentRate');
    const inverseRateEl = document.getElementById('inverseRate');
    const subPricesEl = document.getElementById('subPrices');
    const conversionAmountEl = document.getElementById('conversionAmount');
    const atomPriceEl = document.getElementById('atomPrice');
    const solPriceEl = document.getElementById('solPrice');
    const loaderEl = document.getElementById('loader');

    const symbolEditor = document.getElementById('symbolEditor');
    const symbolInput = document.getElementById('symbolInput');
    const symbolSave = document.getElementById('symbolSave');
    const symbolMessage = document.getElementById('symbolMessage');
    const symbolButtons = {
      base: document.getElementById('baseSymbol'),
      quote: document.getElementById('quoteSymbol')
    };
    let editingSide = null;
    let validationRequest = 0;

    function updatePairLabels() {
      const { base, quote } = selectedPair;
      symbolButtons.base.textContent = base;
      symbolButtons.quote.textContent = quote;
      document.getElementById('amountLabel').textContent = `Ilość ${base}`;
      document.title = `${base} / ${quote} Tracker`;
      document.getElementById('basePriceTitle').textContent = `${base} / USDC`;
      document.getElementById('quotePriceTitle').textContent = `${quote} / USDC`;
      currentRateEl.textContent = 'Ładowanie...';
      inverseRateEl.textContent = 'Ładowanie...';
      subPricesEl.textContent = `${base}: $-- | ${quote}: $--`;
      atomPriceEl.textContent = '$--';
      solPriceEl.textContent = '$--';
      if (chartInstance) chartInstance.data.datasets[0].label = `1 ${base} = x ${quote}`;
    }

    function closeSymbolEditor() {
      validationRequest++;
      const button = symbolButtons[editingSide];
      editingSide = null;
      symbolEditor.hidden = true;
      symbolSave.disabled = false;
      Object.values(symbolButtons).forEach((el) => el.setAttribute('aria-expanded', 'false'));
      button?.focus();
    }

    for (const side of ['base', 'quote']) {
      symbolButtons[side].addEventListener('click', () => {
        validationRequest++;
        editingSide = side;
        symbolEditor.hidden = false;
        symbolSave.disabled = false;
        symbolInput.value = selectedPair[side];
        symbolMessage.classList.remove('error');
        symbolMessage.textContent = 'Wpisz symbol, np. BTC. Wymagany aktywny rynek w USDC na Binance.';
        document.getElementById('symbolLabel').textContent = side === 'base'
          ? 'Przeliczaj z:' : 'Przeliczaj na:';
        Object.entries(symbolButtons).forEach(([key, el]) => el.setAttribute('aria-expanded', String(key === side)));
        symbolInput.focus();
        symbolInput.select();
      });
    }

    document.getElementById('symbolCancel').addEventListener('click', closeSymbolEditor);
    symbolEditor.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeSymbolEditor();
      }
    });

    async function validateMarket(symbol) {
      const marketSymbol = `${symbol}USDC`;
      const response = await fetch(`https://api.binance.com/api/v3/exchangeInfo?symbol=${encodeURIComponent(marketSymbol)}`);
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        if (error.code === -1121) throw new Error(`Brak rynku ${symbol} / USDC na Binance.`);
        throw new Error('Nie udało się sprawdzić symbolu na Binance. Spróbuj ponownie.');
      }
      const data = await response.json();
      const market = data.symbols?.find((item) => item.symbol === marketSymbol
        && item.baseAsset === symbol && item.quoteAsset === 'USDC');
      if (!market || market.status !== 'TRADING' || market.isSpotTradingAllowed !== true) {
        throw new Error(`Brak aktywnego rynku spot ${symbol} / USDC na Binance.`);
      }
    }

    symbolEditor.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!editingSide || symbolSave.disabled) return;
      const side = editingSide;
      const symbol = symbolInput.value.trim().toUpperCase();
      symbolInput.value = symbol;
      symbolMessage.classList.remove('error');
      if (!validSymbol(symbol)) {
        symbolMessage.classList.add('error');
        symbolMessage.textContent = 'Wpisz symbol waluty (litery i cyfry), np. BTC.';
        return;
      }
      const requestId = ++validationRequest;
      symbolSave.disabled = true;
      symbolMessage.textContent = 'Sprawdzanie symbolu na Binance...';
      try {
        await validateMarket(symbol);
        if (requestId !== validationRequest) return;
        selectedPair = { ...selectedPair, [side]: symbol };
        let saved = true;
        try { localStorage.setItem(PAIR_STORAGE_KEY, JSON.stringify(selectedPair)); }
        catch (_) { saved = false; }
        // Usuń dane poprzedniej pary, zanim nowe odpowiedzi dotrą z giełdy.
        ++loadRequest;
        currentRatio = null;
        updatePairLabels();
        for (const chart of [chartInstance, atomChartInstance, solChartInstance]) {
          if (!chart) continue;
          chart.data.labels = [];
          chart.data.datasets[0].data = [];
          delete chart.options.scales.y.min;
          delete chart.options.scales.y.max;
          chart.update();
        }
        closeSymbolEditor();
        if (!saved) {
          symbolEditor.hidden = false;
          symbolMessage.classList.add('error');
          symbolMessage.textContent = 'Para zmieniona. Przeglądarka blokuje zapis — wybór nie zostanie zapamiętany.';
        }
        loadData(activeTf);
      } catch (error) {
        if (requestId !== validationRequest) return;
        symbolMessage.classList.add('error');
        symbolMessage.textContent = error.message === 'Failed to fetch'
          ? 'Nie udało się połączyć z Binance. Spróbuj ponownie.' : error.message;
      } finally {
        if (requestId === validationRequest) symbolSave.disabled = false;
      }
    });

    const priceLinesPlugin = {
      id: 'priceLines',
      afterDatasetsDraw(chart) {
        const dataset = chart.data.datasets[primaryDatasetIndex];
        if (!dataset?.data?.length) return;

        const validValues = dataset.data.filter((value) => Number.isFinite(value) && value > 0);
        if (!validValues.length) return;

        const { ctx, chartArea, scales } = chart;
        if (!ctx || !chartArea || !scales?.y) return;

        // Aktualny kurs z tickera; gdy jeszcze nie dotarł, wykres pokazuje
        // close ostatniej dostępnej świecy.
        const latestPrice = currentRatio ?? lastValidValue(dataset.data);
        const averagePrice = validValues.reduce((sum, price) => sum + price, 0) / validValues.length;
        const activeElement = chart.getActiveElements()
          .find((element) => element.datasetIndex === primaryDatasetIndex)?.element;
        const points = chart.getDatasetMeta(primaryDatasetIndex)?.data || [];
        let referencePoint = activeElement;

        if (!referencePoint || !Number.isFinite(referencePoint.x)) {
          for (let index = dataset.data.length - 1; index >= 0; index--) {
            if (Number.isFinite(dataset.data[index]) && points[index]) {
              referencePoint = points[index];
              break;
            }
          }
        }

        const labelHeight = 18;
        const labelHalf = labelHeight / 2;
        const minY = chartArea.top + labelHalf;
        const maxY = chartArea.bottom - labelHalf;
        if (maxY < minY) return;
        const clampY = (value) => Math.min(Math.max(value, minY), maxY);
        const latestLineY = clampY(scales.y.getPixelForValue(latestPrice));
        const averageLineY = clampY(scales.y.getPixelForValue(averagePrice));
        let latestY = latestLineY;
        let averageY = averageLineY;

        // Obie etykiety startują dokładnie na swoich liniach; odsuwamy tylko wtedy,
        // gdy nachodzą na siebie i w obrębie wykresu nie ma miejsca na rozdzielenie.
        if (Math.abs(latestY - averageY) < labelHeight) {
          const needed = labelHeight - Math.abs(latestY - averageY);
          if (averageY >= latestY) {
            const roomBelow = maxY - averageY;
            if (roomBelow >= needed) {
              averageY += needed;
            } else {
              const roomAbove = latestY - minY;
              if (roomAbove >= needed) {
                latestY -= needed;
              } else {
                averageY = Math.min(maxY, averageY + needed);
                latestY = Math.max(minY, latestY - Math.max(0, needed - roomBelow));
              }
            }
          } else {
            const roomBelow = maxY - latestY;
            if (roomBelow >= needed) {
              latestY += needed;
            } else {
              const roomAbove = averageY - minY;
              if (roomAbove >= needed) {
                averageY -= needed;
              } else {
                latestY = Math.min(maxY, latestY + needed);
                averageY = Math.max(minY, averageY - Math.max(0, needed - roomBelow));
              }
            }
          }
        }

        const labels = [
          { text: formatRatio(latestPrice), y: latestY, color: '#ffd700' },
          { text: formatRatio(averagePrice), y: averageY, color: '#2ea043' }
        ].sort((left, right) => left.y - right.y);

        ctx.save();
        ctx.lineWidth = 1;

        if (referencePoint && Number.isFinite(referencePoint.x)) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.moveTo(referencePoint.x, chartArea.top);
          ctx.lineTo(referencePoint.x, chartArea.bottom);
          ctx.stroke();
        }

        ctx.strokeStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, latestLineY);
        ctx.lineTo(chartArea.right, latestLineY);
        ctx.stroke();

        ctx.strokeStyle = '#2ea043';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, averageLineY);
        ctx.lineTo(chartArea.right, averageLineY);
        ctx.stroke();

        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const centerX = (chartArea.left + chartArea.right) / 2;

        for (const label of labels) {
          const textWidth = ctx.measureText(label.text).width;
          const labelX = findLabelX(
            collectOccupiedX(points, dataset.data, label.y - 9, label.y + 9),
            textWidth + 8,
            chartArea,
          ) ?? centerX;
          ctx.fillStyle = 'rgba(14, 17, 23, 0.92)';
          ctx.fillRect(labelX - textWidth / 2 - 4, label.y - 9, textWidth + 8, 18);
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, labelX, label.y);
        }

        ctx.restore();
      }
    };

    // Inicjalizacja pustego wykresu Chart.js
    function initChart() {
      const ctx = document.getElementById('ratioChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: `1 ${selectedPair.base} = x ${selectedPair.quote}`,
            data: [],
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88, 166, 255, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: '#58a6ff',
            pointBorderColor: '#f0f6fc',
            pointBorderWidth: 1,
            pointHitRadius: 10,
            fill: true,
            tension: 0.2
          }]
        },
        plugins: [priceLinesPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: (tooltipItem) => {
                  const atomSol = Number(tooltipItem.parsed.y);
                  if (!Number.isFinite(atomSol) || atomSol <= 0) {
                    return [`${selectedPair.base}/${selectedPair.quote}: --`, `${selectedPair.quote}/${selectedPair.base}: --`];
                  }
                  const amount = conversionAmountEl.valueAsNumber;
                  const converted = amount * atomSol;
                  return [
                    `${selectedPair.base}/${selectedPair.quote}: ${formatRatio(atomSol)} ${selectedPair.quote}`,
                    `${selectedPair.quote}/${selectedPair.base}: ${formatRatio(1 / atomSol)} ${selectedPair.base}`,
                    Number.isFinite(amount) && amount >= 0 && Number.isFinite(converted)
                      ? `${amount} ${selectedPair.base} → ${converted === 0 ? '0' : formatRatio(converted)} ${selectedPair.quote}`
                      : `Ilość ${selectedPair.base} → — ${selectedPair.quote}`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#21262d' },
              ticks: { color: '#8b949e', maxTicksLimit: 8 }
            },
            y: {
              position: 'right',
              grid: { color: '#21262d' },
              ticks: {
                color: '#8b949e',
                callback: (val) => formatRatio(Number(val))
              }
            }
          }
        }
      });
    }

    // Osobny wykres ceny jednego aktywa w USDC
    function initPriceChart(canvasId, borderColor, fillColor) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            data: [],
            borderColor: borderColor,
            backgroundColor: fillColor,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHitRadius: 10,
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: (tooltipItem) => {
                  const price = Number(tooltipItem.parsed.y);
                  return Number.isFinite(price) ? `${price.toFixed(4)} USDC` : '--';
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#21262d' },
              ticks: { color: '#8b949e', maxTicksLimit: 4 }
            },
            y: {
              position: 'right',
              grid: { color: '#21262d' },
              ticks: {
                color: '#8b949e',
                maxTicksLimit: 5,
                callback: (val) => `$${Number(val).toFixed(2)}`
              }
            }
          }
        }
      });
    }

    // Pobieranie świeczek (k-lines) z Binance
    async function fetchKlines(symbol, interval, limit) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Błąd pobierania danych');
      return await res.json();
    }

    // Aktualna cena pojedynczej pary z tickera
    async function fetchTickerPrice(symbol) {
      const url = `https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Błąd pobierania danych');
      const data = await res.json();
      return parseClose(data.price);
    }

    // Żywe ceny obu aktywów z tickera. Zwraca null, gdy Binance nie odpowiada,
    // bo wykres oparty na k-line'ach musi działać także wtedy.
    async function fetchLivePrices(pair) {
      const [atomPrice, solPrice] = await Promise.all([
        fetchTickerPrice(`${pair.base}USDC`),
        fetchTickerPrice(`${pair.quote}USDC`)
      ]);
      if (!atomPrice || !solPrice) return null;
      return { atom: atomPrice, sol: solPrice, ratio: atomPrice / solPrice };
    }

    // Skala Y liczy się z serii świec, więc żywy kurs czasem wypada poza
    // jej zakres i żółta linia przykleja się do krawędzi wykresu.
    function applyRatioScale() {
      const values = chartInstance.data.datasets[primaryDatasetIndex].data
        .filter((value) => Number.isFinite(value) && value > 0);
      if (!values.length || currentRatio === null) return;

      const lowest = Math.min(...values);
      const highest = Math.max(...values);
      if (currentRatio > highest) chartInstance.options.scales.y.max = currentRatio * 1.02;
      else if (currentRatio < lowest) chartInstance.options.scales.y.min = currentRatio * 0.98;
    }

    // Aktualizacja widoku i wykresu
    async function loadData(tfKey) {
      const requestId = ++loadRequest;
      loaderEl.style.display = 'block';
      const conf = TIMEFRAMES[tfKey];
      const pair = { ...selectedPair };

      try {
        const [atomKlines, solKlines, live] = await Promise.all([
          fetchKlines(`${pair.base}USDC`, conf.interval, conf.limit),
          fetchKlines(`${pair.quote}USDC`, conf.interval, conf.limit),
          fetchLivePrices(pair).catch(() => null)
        ]);
        if (requestId !== loadRequest) return;

        currentRatio = live ? live.ratio : null;

        const atomByTimestamp = new Map();
        const solByTimestamp = new Map();

        for (const kline of atomKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) atomByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        for (const kline of solKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) solByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        const timestamps = Array.from(new Set([
          ...atomByTimestamp.keys(),
          ...solByTimestamp.keys()
        ])).sort((left, right) => left - right);
        const labels = [];
        const ratios = [];
        const atomPrices = [];
        const solPrices = [];

        for (const timestamp of timestamps) {
          let atomClose = atomByTimestamp.get(timestamp) ?? null;
          let solClose = solByTimestamp.get(timestamp) ?? null;

          // Binance zwraca świecę w trakcie tworzenia tylko dla jednej
          // z par, więc na końcu serii zostaje dziura: wykres rwie linię
          // i ostatni punkt zostaje bez połączenia. Brakujący close
          // uzupełniamy bieżącą ceną z tickera.
          if (live) {
            if (atomClose === null) atomClose = live.atom;
            if (solClose === null) solClose = live.sol;
          }

          labels.push(formatTimestamp(timestamp, tfKey));
          atomPrices.push(atomClose);
          solPrices.push(solClose);
          ratios.push(atomClose !== null && solClose !== null ? atomClose / solClose : null);
        }

        const lastAtom = lastValidValue(atomPrices);
        const lastDot = lastValidValue(solPrices);
        const lastAlignedRatio = currentRatio
          ?? ratios.findLast((ratio) => Number.isFinite(ratio) && ratio > 0);

        if (lastAlignedRatio !== undefined && lastAlignedRatio !== null) {
          currentRateEl.innerText = `1 ${pair.base} = ${formatRatio(lastAlignedRatio)} ${pair.quote}`;
          inverseRateEl.innerText = `1 ${pair.quote} = ${formatRatio(1 / lastAlignedRatio)} ${pair.base}`;
        } else {
          currentRateEl.innerText = 'Brak danych';
          inverseRateEl.innerText = 'Brak danych';
        }

        const atomArrow = directionArrow(lastCandleDirection(atomKlines));
        const solArrow = directionArrow(lastCandleDirection(solKlines));
        const atomPriceText = lastAtom === null ? '$--' : `$${lastAtom.toFixed(2)}`;
        const solPriceText = lastDot === null ? '$--' : `$${lastDot.toFixed(2)}`;

        subPricesEl.innerHTML = [
          `${pair.base}: ${atomPriceText}`,
          `<span class="arrow ${atomArrow.className}">${atomArrow.text}</span>`,
          '|',
          `${pair.quote}: ${solPriceText}`,
          `<span class="arrow ${solArrow.className}">${solArrow.text}</span>`
        ].join(' ');

        atomPriceEl.innerText = lastAtom === null ? '$--' : `$${formatUsd(lastAtom)}`;
        solPriceEl.innerText = lastDot === null ? '$--' : `$${formatUsd(lastDot)}`;

        // Skala wraca do automatycznej przy zmianie interwału, bo poprzedni
        // zakres mógł zostać rozszerzony pod żywy kurs. Potem rozszerzamy ją
        // ponownie, gdyby żywy kurs wypadł poza zakres serii świec.
        delete chartInstance.options.scales.y.min;
        delete chartInstance.options.scales.y.max;
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = ratios;
        applyRatioScale();
        chartInstance.update();

        if (atomChartInstance) {
          atomChartInstance.data.labels = labels;
          atomChartInstance.data.datasets[0].data = atomPrices;
          atomChartInstance.update();
        }

        if (solChartInstance) {
          solChartInstance.data.labels = labels;
          solChartInstance.data.datasets[0].data = solPrices;
          solChartInstance.update();
        }
      } catch (err) {
        if (requestId !== loadRequest) return;
        console.error(err);
        currentRateEl.innerText = 'Błąd pobierania';
        inverseRateEl.innerText = 'Błąd pobierania';
      } finally {
        if (requestId === loadRequest) loaderEl.style.display = 'none';
      }
    }

    // Obsługa przełączania interwałów
    document.getElementById('intervals').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#intervals button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeTf = e.target.getAttribute('data-tf');
      loadData(activeTf);
    });

    // Start
    updatePairLabels();
    initChart();
    atomChartInstance = initPriceChart('atomChart', '#2ea043', 'rgba(46, 160, 67, 0.12)');
    solChartInstance = initPriceChart('solChart', '#bc8cff', 'rgba(188, 140, 255, 0.12)');
    loadData(activeTf);

    // Auto-odświeżanie co 30 sekund
    setInterval(() => loadData(activeTf), 30000);
  </script>
</body>
