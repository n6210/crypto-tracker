<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATOM / DOT Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --primary: #58a6ff;
      --accent: #238636;
      --accent-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .title-group h1 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-bright);
      margin: 0;
    }

    .current-rate,
    .inverse-rate {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #8b949e;
    }

    .rate-separator {
      color: #8b949e;
      font-size: 0.9rem;
    }

    .sub-prices {
      flex-basis: 100%;
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 4px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--primary);
      color: var(--text-bright);
    }

    button.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #000;
      font-weight: bold;
    }

    .chart-box {
      position: relative;
      height: 400px;
      width: 100%;
    }

    .loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(14, 17, 23, 0.85);
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>ATOM / DOT</h1>
        <div class="current-rate" id="currentRate">Ładowanie...</div>
        <span class="rate-separator">|</span>
        <div class="inverse-rate" id="inverseRate">Ładowanie...</div>
        <div class="sub-prices" id="subPrices">ATOM: $-- | DOT: $--</div>
      </div>
    </div>

    <!-- Przyciski interwałów -->
    <div class="btn-group" id="intervals">
      <button data-tf="1h">1h</button>
      <button data-tf="4h">4h</button>
      <button data-tf="8h">8h</button>
      <button data-tf="24h" class="active">24h</button>
      <button data-tf="7d">7d</button>
      <button data-tf="30d">30d</button>
      <button data-tf="6m">6m</button>
      <button data-tf="1y">1y</button>
    </div>

    <div class="chart-box">
      <div class="loader" id="loader">Pobieranie danych z rynku...</div>
      <canvas id="ratioChart"></canvas>
    </div>
  </div>

  <script>
    // Konfiguracja pobierania danych Binance dla wybranego zakresu
    const TIMEFRAMES = {
      '1h':  { interval: '1m',  limit: 60 },
      '4h':  { interval: '3m',  limit: 80 },
      '8h':  { interval: '5m',  limit: 96 },
      '24h': { interval: '15m', limit: 96 },
      '7d':  { interval: '2h',  limit: 84 },
      '30d': { interval: '6h',  limit: 120 },
      '6m':  { interval: '1d',  limit: 180 },
      '1y':  { interval: '1d',  limit: 365 }
    };

    let activeTf = '24h';
    let chartInstance = null;
    let loadRequest = 0;
    const primaryDatasetIndex = 0;

    function parseClose(value) {
      if (value === null || value === undefined || value === '') return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function parseTimestamp(value) {
      const parsed = Number(value);
      if (!Number.isSafeInteger(parsed) || parsed <= 0) return null;
      const date = new Date(parsed);
      return Number.isFinite(date.getTime()) ? parsed : null;
    }

    function lastValidValue(values) {
      for (let index = values.length - 1; index >= 0; index--) {
        if (Number.isFinite(values[index]) && values[index] > 0) return values[index];
      }
      return null;
    }

    function hasValidValue(values) {
      return values.some((value) => Number.isFinite(value) && value > 0);
    }

    function formatTimestamp(timestamp, tfKey) {
      const date = new Date(timestamp);
      return (tfKey === '6m' || tfKey === '1y')
        ? date.toLocaleDateString([], { month: 'short', day: 'numeric' })
        : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    if (Chart.Interaction && Chart.Interaction.modes) {
      Chart.Interaction.modes.primaryIndex = (chart, event, options, useFinalPosition) => {
        const primaryMetas = chart.getSortedVisibleDatasetMetas()
          .filter((meta) => meta.index === primaryDatasetIndex);
        const interactionChart = Object.create(chart);
        interactionChart.getSortedVisibleDatasetMetas = () => primaryMetas;
        return Chart.Interaction.modes.index(
          interactionChart,
          event,
          options,
          useFinalPosition,
        );
      };
    }

    const currentRateEl = document.getElementById('currentRate');
    const inverseRateEl = document.getElementById('inverseRate');
    const subPricesEl = document.getElementById('subPrices');
    const loaderEl = document.getElementById('loader');

    const priceLinesPlugin = {
      id: 'priceLines',
      afterDatasetsDraw(chart) {
        const dataset = chart.data.datasets[primaryDatasetIndex];
        if (!dataset?.data?.length) return;

        const validValues = dataset.data.filter((value) => Number.isFinite(value) && value > 0);
        if (!validValues.length) return;

        const { ctx, chartArea, scales } = chart;
        if (!ctx || !chartArea || !scales?.y) return;

        const latestPrice = lastValidValue(dataset.data);
        const averagePrice = validValues.reduce((sum, price) => sum + price, 0) / validValues.length;
        const activeElement = chart.getActiveElements()
          .find((element) => element.datasetIndex === primaryDatasetIndex)?.element;
        const points = chart.getDatasetMeta(primaryDatasetIndex)?.data || [];
        let referencePoint = activeElement;

        if (!referencePoint || !Number.isFinite(referencePoint.x)) {
          for (let index = dataset.data.length - 1; index >= 0; index--) {
            if (Number.isFinite(dataset.data[index]) && points[index]) {
              referencePoint = points[index];
              break;
            }
          }
        }

        const labelHeight = 18;
        const labelHalf = labelHeight / 2;
        const minY = chartArea.top + labelHalf;
        const maxY = chartArea.bottom - labelHalf;
        if (maxY < minY) return;
        const clampY = (value) => Math.min(Math.max(value, minY), maxY);
        const latestLineY = clampY(scales.y.getPixelForValue(latestPrice));
        const averageLineY = clampY(scales.y.getPixelForValue(averagePrice));
        let latestY = latestLineY;
        let averageY = clampY(averageLineY + 16);

        if (Math.abs(latestY - averageY) <= 16) {
          const gap = Math.abs(latestY - averageY);
          if (gap < labelHeight) {
            const needed = labelHeight - gap;
            if (averageY > latestY) {
              const roomAbove = latestY - minY;
              if (roomAbove >= needed) {
                latestY -= needed;
              } else {
                averageY = Math.min(maxY, averageY + (needed - roomAbove));
              }
            } else {
              const roomBelow = maxY - averageY;
              if (roomBelow >= needed) {
                averageY += needed;
              } else {
                latestY = Math.max(minY, latestY - (needed - roomBelow));
              }
            }
          }
        }

        const labels = [
          { text: latestPrice.toFixed(2), y: latestY, color: '#ffd700' },
          { text: averagePrice.toFixed(2), y: averageY, color: '#2ea043' }
        ].sort((left, right) => left.y - right.y);

        ctx.save();
        ctx.lineWidth = 1;

        if (referencePoint && Number.isFinite(referencePoint.x)) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.moveTo(referencePoint.x, chartArea.top);
          ctx.lineTo(referencePoint.x, chartArea.bottom);
          ctx.stroke();
        }

        ctx.strokeStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, latestLineY);
        ctx.lineTo(chartArea.right, latestLineY);
        ctx.stroke();

        ctx.strokeStyle = '#2ea043';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, averageLineY);
        ctx.lineTo(chartArea.right, averageLineY);
        ctx.stroke();

        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        for (const label of labels) {
          const labelX = chartArea.left + 6;
          const textWidth = ctx.measureText(label.text).width;
          ctx.fillStyle = 'rgba(14, 17, 23, 0.88)';
          ctx.fillRect(labelX - 3, label.y - 9, textWidth + 6, 18);
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, labelX, label.y);
        }

        ctx.restore();
      }
    };

    // Inicjalizacja pustego wykresu Chart.js
    function initChart() {
      const ctx = document.getElementById('ratioChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: '1 ATOM = x DOT',
            data: [],
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88, 166, 255, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: '#58a6ff',
            pointBorderColor: '#f0f6fc',
            pointBorderWidth: 1,
            pointHitRadius: 10,
            fill: true,
            tension: 0.2
          }, {
            label: 'ATOM',
            data: [],
            yAxisID: 'yPrice',
            borderColor: 'rgba(46, 160, 67, 0.58)',
            backgroundColor: 'rgba(46, 160, 67, 0.08)',
            borderWidth: 2,
            showLine: true,
            fill: false,
            spanGaps: false,
            pointRadius: 2,
            pointHoverRadius: 4,
            pointBackgroundColor: '#2ea043',
            pointBorderColor: '#f0f6fc',
            pointBorderWidth: 1,
            pointHitRadius: 0,
            tooltip: { enabled: false }
          }, {
            label: 'DOT',
            data: [],
            yAxisID: 'yPrice',
            borderColor: 'rgba(188, 140, 255, 0.58)',
            backgroundColor: 'rgba(188, 140, 255, 0.08)',
            borderWidth: 2,
            showLine: true,
            fill: false,
            spanGaps: false,
            pointRadius: 2,
            pointHoverRadius: 4,
            pointBackgroundColor: '#bc8cff',
            pointBorderColor: '#f0f6fc',
            pointBorderWidth: 1,
            pointHitRadius: 0,
            tooltip: { enabled: false }
          }]
        },
        plugins: [priceLinesPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'primaryIndex',
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                filter: (legendItem) => ['ATOM', 'DOT'].includes(legendItem.text)
              }
            },
            tooltip: {
              displayColors: false,
              filter: (tooltipItem) => tooltipItem.datasetIndex === primaryDatasetIndex,
              callbacks: {
                label: (tooltipItem) => {
                  const atomDot = Number(tooltipItem.parsed.y);
                  if (!Number.isFinite(atomDot) || atomDot <= 0) {
                    return ['ATOM/DOT: --', 'DOT/ATOM: --'];
                  }
                  return [
                    `ATOM/DOT: ${atomDot.toFixed(4)} DOT`,
                    `DOT/ATOM: ${(1 / atomDot).toFixed(4)} ATOM`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#21262d' },
              ticks: { color: '#8b949e', maxTicksLimit: 8 }
            },
            y: {
              grid: { color: '#21262d' },
              ticks: {
                color: '#8b949e',
                callback: (val) => val.toFixed(4)
              }
            },
            yPrice: {
              position: 'right',
              title: {
                display: true,
                text: 'USDT'
              },
              grid: { drawOnChartArea: false },
              ticks: {
                color: '#8b949e',
                callback: (val) => `${Number(val).toFixed(2)} USDT`
              }
            }
          }
        }
      });
    }

    // Pobieranie świeczek (k-lines) z Binance
    async function fetchKlines(symbol, interval, limit) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Błąd pobierania danych');
      return await res.json();
    }

    // Aktualizacja widoku i wykresu
    async function loadData(tfKey) {
      const requestId = ++loadRequest;
      loaderEl.style.display = 'block';
      const conf = TIMEFRAMES[tfKey];

      try {
        const [atomKlines, dotKlines] = await Promise.all([
          fetchKlines('ATOMUSDT', conf.interval, conf.limit),
          fetchKlines('DOTUSDT', conf.interval, conf.limit)
        ]);
        if (requestId !== loadRequest) return;

        const atomByTimestamp = new Map();
        const dotByTimestamp = new Map();

        for (const kline of atomKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) atomByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        for (const kline of dotKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) dotByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        const timestamps = Array.from(new Set([
          ...atomByTimestamp.keys(),
          ...dotByTimestamp.keys()
        ])).sort((left, right) => left - right);
        const labels = [];
        const ratios = [];
        const atomPrices = [];
        const dotPrices = [];

        for (const timestamp of timestamps) {
          const atomClose = atomByTimestamp.get(timestamp) ?? null;
          const dotClose = dotByTimestamp.get(timestamp) ?? null;

          labels.push(formatTimestamp(timestamp, tfKey));
          atomPrices.push(atomClose);
          dotPrices.push(dotClose);
          ratios.push(atomClose !== null && dotClose !== null ? atomClose / dotClose : null);
        }

        const lastAtom = lastValidValue(atomPrices);
        const lastDot = lastValidValue(dotPrices);
        const lastAlignedRatio = ratios.findLast((ratio) => Number.isFinite(ratio) && ratio > 0);

        if (lastAlignedRatio !== undefined) {
          currentRateEl.innerText = `1 ATOM = ${lastAlignedRatio.toFixed(4)} DOT`;
          inverseRateEl.innerText = `1 DOT = ${(1 / lastAlignedRatio).toFixed(4)} ATOM`;
        } else {
          currentRateEl.innerText = 'Brak danych';
          inverseRateEl.innerText = 'Brak danych';
        }

        subPricesEl.innerText = `ATOM: ${lastAtom === null ? '$--' : `$${lastAtom.toFixed(2)}`} | DOT: ${lastDot === null ? '$--' : `$${lastDot.toFixed(2)}`}`;

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = ratios;

        if (chartInstance.data.datasets[1]) {
          chartInstance.data.datasets[1].data = atomPrices;
          chartInstance.setDatasetVisibility(1, hasValidValue(atomPrices));
        }

        if (chartInstance.data.datasets[2]) {
          chartInstance.data.datasets[2].data = dotPrices;
          chartInstance.setDatasetVisibility(2, hasValidValue(dotPrices));
        }

        chartInstance.update();
      } catch (err) {
        if (requestId !== loadRequest) return;
        console.error(err);
        currentRateEl.innerText = 'Błąd pobierania';
        inverseRateEl.innerText = 'Błąd pobierania';
      } finally {
        if (requestId === loadRequest) loaderEl.style.display = 'none';
      }
    }

    // Obsługa przełączania interwałów
    document.getElementById('intervals').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#intervals button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeTf = e.target.getAttribute('data-tf');
      loadData(activeTf);
    });

    // Start
    initChart();
    loadData(activeTf);

    // Auto-odświeżanie co 30 sekund
    setInterval(() => loadData(activeTf), 30000);
  </script>
</body>
</html>
