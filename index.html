<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATOM / SOL Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --muted: #8b949e;
      --primary: #58a6ff;
      --accent: #238636;
      --accent-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
      white-space: nowrap;
    }

    .title-group h1 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-bright);
      margin: 0;
    }

    .current-rate,
    .inverse-rate {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #8b949e;
    }

    .rate-separator {
      color: #8b949e;
      font-size: 0.9rem;
    }

    .sub-prices {
      font-size: 0.9rem;
      color: #8b949e;
    }

    .arrow {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1;
    }

    .arrow.up { color: #3fb950; }
    .arrow.down { color: #f85149; }
    .arrow.flat { color: #ffd700; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .legend-line {
      width: 18px;
      height: 2px;
      border-radius: 1px;
    }

    .legend-line.current { background-color: #ffd700; }
    .legend-line.average { background-color: #2ea043; }

    button {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--primary);
      color: var(--text-bright);
    }

    button.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #000;
      font-weight: bold;
    }

    .chart-box {
      position: relative;
      height: 400px;
      width: 100%;
    }

    .price-charts {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .price-card {
      flex: 1 1 0;
      min-width: 0;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .price-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .price-card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .price-card-value {
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .price-card.atom h2 { color: #2ea043; }
    .price-card.atom .price-card-value { color: #2ea043; }
    .price-card.sol h2 { color: #bc8cff; }
    .price-card.sol .price-card-value { color: #bc8cff; }

    .price-chart-box {
      position: relative;
      height: 200px;
      width: 100%;
    }

    .loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(14, 17, 23, 0.85);
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>ATOM / SOL</h1>
        <div class="current-rate" id="currentRate">Ładowanie...</div>
        <span class="rate-separator">|</span>
        <div class="inverse-rate" id="inverseRate">Ładowanie...</div>
        <span class="rate-separator">|</span>
        <div class="sub-prices" id="subPrices">ATOM: $-- | SOL: $--</div>
      </div>
    </div>

    <!-- Przyciski interwałów -->
    <div class="toolbar">
      <div class="btn-group" id="intervals">
        <button data-tf="1h">1h</button>
        <button data-tf="4h">4h</button>
        <button data-tf="8h">8h</button>
        <button data-tf="24h" class="active">24h</button>
        <button data-tf="7d">7d</button>
        <button data-tf="30d">30d</button>
        <button data-tf="6m">6m</button>
        <button data-tf="1y">1y</button>
      </div>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-line current"></span>aktualne ratio</span>
        <span class="legend-item"><span class="legend-line average"></span>średnie ratio w zakresie</span>
      </div>
    </div>

    <div class="chart-box">
      <div class="loader" id="loader">Pobieranie danych z rynku...</div>
      <canvas id="ratioChart"></canvas>
    </div>

    <div class="price-charts">
      <div class="price-card atom">
        <div class="price-card-head">
          <h2>ATOM / USDC</h2>
          <div class="price-card-value" id="atomPrice">$--</div>
        </div>
        <div class="price-chart-box">
          <canvas id="atomChart"></canvas>
        </div>
      </div>
      <div class="price-card sol">
        <div class="price-card-head">
          <h2>SOL / USDC</h2>
          <div class="price-card-value" id="solPrice">$--</div>
        </div>
        <div class="price-chart-box">
          <canvas id="solChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Konfiguracja pobierania danych Binance dla wybranego zakresu
    const TIMEFRAMES = {
      '1h':  { interval: '1m',  limit: 60 },
      '4h':  { interval: '3m',  limit: 80 },
      '8h':  { interval: '5m',  limit: 96 },
      '24h': { interval: '15m', limit: 96 },
      '7d':  { interval: '2h',  limit: 84 },
      '30d': { interval: '6h',  limit: 120 },
      '6m':  { interval: '1d',  limit: 180 },
      '1y':  { interval: '1d',  limit: 365 }
    };

    let activeTf = '24h';
    let chartInstance = null;
    let atomChartInstance = null;
    let solChartInstance = null;
    let loadRequest = 0;
    const primaryDatasetIndex = 0;

    // Żywy kurs z tickera Binance. Żółta linia na wykresie pokazuje tę
    // wartość, a nie close ostatniej świecy, który przy interwałach dobowych
    // może być sprzed wielu godzin.
    let currentRatio = null;

    function parseClose(value) {
      if (value === null || value === undefined || value === '') return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function parseTimestamp(value) {
      const parsed = Number(value);
      if (!Number.isSafeInteger(parsed) || parsed <= 0) return null;
      const date = new Date(parsed);
      return Number.isFinite(date.getTime()) ? parsed : null;
    }

    function lastValidValue(values) {
      for (let index = values.length - 1; index >= 0; index--) {
        if (Number.isFinite(values[index]) && values[index] > 0) return values[index];
      }
      return null;
    }

    // Zwraca posortowane pozycje X zajęte przez serię w paśmie Y.
    // Uwzględnia też odcinki linii między punktami, bo sama siatka punktów
    // jest zbyt rzadka, żeby wykryć stromo opadający fragment w paśmie.
    function collectOccupiedX(points, validData, bandTop, bandBottom) {
      const occupied = [];
      let previous = null;

      for (let index = 0; index < points.length; index++) {
        const point = points[index];
        const value = Number(validData[index]);
        const isValid = point && Number.isFinite(point.x) && Number.isFinite(value) && value > 0;

        if (!isValid) {
          previous = null;
          continue;
        }

        if (point.y >= bandTop && point.y <= bandBottom) {
          occupied.push(point.x);
        }

        if (previous) {
          const spanX = point.x - previous.x;
          const spanY = point.y - previous.y;
          const steps = Math.max(1, Math.ceil(Math.max(Math.abs(spanX), Math.abs(spanY)) / 3));
          for (let step = 1; step < steps; step++) {
            const ratio = step / steps;
            const sampleX = previous.x + spanX * ratio;
            const sampleY = previous.y + spanY * ratio;
            if (sampleY >= bandTop && sampleY <= bandBottom) {
              occupied.push(sampleX);
            }
          }
        }

        previous = { x: point.x, y: point.y };
      }

      return occupied.sort((left, right) => left - right);
    }

    // Domyślnie środek wykresu; gdy okno etykiety zachodzi na serię,
    // szuka najbliższej pozycji wolnej. Zwraca null, gdy nie ma miejsca.
    function findLabelX(occupied, labelWidth, chartArea) {
      const half = labelWidth / 2;
      const centerX = (chartArea.left + chartArea.right) / 2;
      const minCenter = chartArea.left + half;
      const maxCenter = chartArea.right - half;
      if (minCenter > maxCenter) return null;

      const isBlocked = (candidate) => {
        const from = candidate - half;
        const to = candidate + half;
        return occupied.some((x) => x >= from - 4 && x <= to + 4);
      };

      if (!isBlocked(centerX)) return centerX;

      let bestX = null;
      let bestDistance = Infinity;

      for (let candidate = minCenter; candidate <= maxCenter; candidate += 4) {
        if (isBlocked(candidate)) continue;
        const distance = Math.abs(candidate - centerX);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestX = candidate;
        }
      }

      return bestX;
    }

    // Kierunek ostatniej świecy: open vs close z ostatniego k-line'a.
    // Zwraca 'up', 'down' albo null, gdy brakuje poprawnych danych.
    function lastCandleDirection(klines) {
      for (let index = klines.length - 1; index >= 0; index--) {
        const kline = klines[index];
        if (!kline) continue;
        const open = parseClose(kline[1]);
        const close = parseClose(kline[4]);
        if (open === null || close === null) continue;
        if (close > open) return 'up';
        if (close < open) return 'down';
        return null;
      }
      return null;
    }

    // Ceny poniżej $10 dostają cztery miejsca po przecinku, powyżej dwa.
    function formatUsd(value) {
      return value < 10 ? value.toFixed(4) : value.toFixed(2);
    }

    // Kurs ATOM/SOL jest rzęd wielkości 0.01, więc cztery miejsca po
    // przecinku; przy dwóch etykiety zlewałyby się w jedną wartość.
    function formatRatio(value) {
      return Number.isFinite(value) && value > 0 ? value.toFixed(4) : '--';
    }

    function directionArrow(direction) {
      if (direction === 'up') return { text: '↑', className: 'up' };
      if (direction === 'down') return { text: '↓', className: 'down' };
      return { text: '→', className: 'flat' };
    }

    // Skala dobowa pokazuje godzinę i minutę, tygodniowa/miesięczna datę
    // z godziną, a roczna sam miesiąc z rokiem.
    function formatTimestamp(timestamp, tfKey) {
      const date = new Date(timestamp);
      if (tfKey === '1h' || tfKey === '4h' || tfKey === '8h' || tfKey === '24h') {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      if (tfKey === '1y') {
        return date.toLocaleDateString([], { month: 'short', year: '2-digit' });
      }
      if (tfKey === '6m') {
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }
      return date.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    const currentRateEl = document.getElementById('currentRate');
    const inverseRateEl = document.getElementById('inverseRate');
    const subPricesEl = document.getElementById('subPrices');
    const atomPriceEl = document.getElementById('atomPrice');
    const solPriceEl = document.getElementById('solPrice');
    const loaderEl = document.getElementById('loader');

    const priceLinesPlugin = {
      id: 'priceLines',
      afterDatasetsDraw(chart) {
        const dataset = chart.data.datasets[primaryDatasetIndex];
        if (!dataset?.data?.length) return;

        const validValues = dataset.data.filter((value) => Number.isFinite(value) && value > 0);
        if (!validValues.length) return;

        const { ctx, chartArea, scales } = chart;
        if (!ctx || !chartArea || !scales?.y) return;

        // Aktualny kurs z tickera; gdy jeszcze nie dotarł, wykres pokazuje
        // close ostatniej dostępnej świecy.
        const latestPrice = currentRatio ?? lastValidValue(dataset.data);
        const averagePrice = validValues.reduce((sum, price) => sum + price, 0) / validValues.length;
        const activeElement = chart.getActiveElements()
          .find((element) => element.datasetIndex === primaryDatasetIndex)?.element;
        const points = chart.getDatasetMeta(primaryDatasetIndex)?.data || [];
        let referencePoint = activeElement;

        if (!referencePoint || !Number.isFinite(referencePoint.x)) {
          for (let index = dataset.data.length - 1; index >= 0; index--) {
            if (Number.isFinite(dataset.data[index]) && points[index]) {
              referencePoint = points[index];
              break;
            }
          }
        }

        const labelHeight = 18;
        const labelHalf = labelHeight / 2;
        const minY = chartArea.top + labelHalf;
        const maxY = chartArea.bottom - labelHalf;
        if (maxY < minY) return;
        const clampY = (value) => Math.min(Math.max(value, minY), maxY);
        const latestLineY = clampY(scales.y.getPixelForValue(latestPrice));
        const averageLineY = clampY(scales.y.getPixelForValue(averagePrice));
        let latestY = latestLineY;
        let averageY = averageLineY;

        // Obie etykiety startują dokładnie na swoich liniach; odsuwamy tylko wtedy,
        // gdy nachodzą na siebie i w obrębie wykresu nie ma miejsca na rozdzielenie.
        if (Math.abs(latestY - averageY) < labelHeight) {
          const needed = labelHeight - Math.abs(latestY - averageY);
          if (averageY >= latestY) {
            const roomBelow = maxY - averageY;
            if (roomBelow >= needed) {
              averageY += needed;
            } else {
              const roomAbove = latestY - minY;
              if (roomAbove >= needed) {
                latestY -= needed;
              } else {
                averageY = Math.min(maxY, averageY + needed);
                latestY = Math.max(minY, latestY - Math.max(0, needed - roomBelow));
              }
            }
          } else {
            const roomBelow = maxY - latestY;
            if (roomBelow >= needed) {
              latestY += needed;
            } else {
              const roomAbove = averageY - minY;
              if (roomAbove >= needed) {
                averageY -= needed;
              } else {
                latestY = Math.min(maxY, latestY + needed);
                averageY = Math.max(minY, averageY - Math.max(0, needed - roomBelow));
              }
            }
          }
        }

        const labels = [
          { text: formatRatio(latestPrice), y: latestY, color: '#ffd700' },
          { text: formatRatio(averagePrice), y: averageY, color: '#2ea043' }
        ].sort((left, right) => left.y - right.y);

        ctx.save();
        ctx.lineWidth = 1;

        if (referencePoint && Number.isFinite(referencePoint.x)) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.moveTo(referencePoint.x, chartArea.top);
          ctx.lineTo(referencePoint.x, chartArea.bottom);
          ctx.stroke();
        }

        ctx.strokeStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, latestLineY);
        ctx.lineTo(chartArea.right, latestLineY);
        ctx.stroke();

        ctx.strokeStyle = '#2ea043';
        ctx.beginPath();
        ctx.moveTo(chartArea.left, averageLineY);
        ctx.lineTo(chartArea.right, averageLineY);
        ctx.stroke();

        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const centerX = (chartArea.left + chartArea.right) / 2;

        for (const label of labels) {
          const textWidth = ctx.measureText(label.text).width;
          const labelX = findLabelX(
            collectOccupiedX(points, dataset.data, label.y - 9, label.y + 9),
            textWidth + 8,
            chartArea,
          ) ?? centerX;
          ctx.fillStyle = 'rgba(14, 17, 23, 0.92)';
          ctx.fillRect(labelX - textWidth / 2 - 4, label.y - 9, textWidth + 8, 18);
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, labelX, label.y);
        }

        ctx.restore();
      }
    };

    // Inicjalizacja pustego wykresu Chart.js
    function initChart() {
      const ctx = document.getElementById('ratioChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: '1 ATOM = x SOL',
            data: [],
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88, 166, 255, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: '#58a6ff',
            pointBorderColor: '#f0f6fc',
            pointBorderWidth: 1,
            pointHitRadius: 10,
            fill: true,
            tension: 0.2
          }]
        },
        plugins: [priceLinesPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: (tooltipItem) => {
                  const atomSol = Number(tooltipItem.parsed.y);
                  if (!Number.isFinite(atomSol) || atomSol <= 0) {
                    return ['ATOM/SOL: --', 'SOL/ATOM: --'];
                  }
                  return [
                    `ATOM/SOL: ${atomSol.toFixed(4)} SOL`,
                    `SOL/ATOM: ${(1 / atomSol).toFixed(4)} ATOM`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#21262d' },
              ticks: { color: '#8b949e', maxTicksLimit: 8 }
            },
            y: {
              position: 'right',
              grid: { color: '#21262d' },
              ticks: {
                color: '#8b949e',
                callback: (val) => val.toFixed(4)
              }
            }
          }
        }
      });
    }

    // Osobny wykres ceny jednego aktywa w USDC
    function initPriceChart(canvasId, borderColor, fillColor) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            data: [],
            borderColor: borderColor,
            backgroundColor: fillColor,
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHitRadius: 10,
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: (tooltipItem) => {
                  const price = Number(tooltipItem.parsed.y);
                  return Number.isFinite(price) ? `${price.toFixed(4)} USDC` : '--';
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#21262d' },
              ticks: { color: '#8b949e', maxTicksLimit: 4 }
            },
            y: {
              position: 'right',
              grid: { color: '#21262d' },
              ticks: {
                color: '#8b949e',
                maxTicksLimit: 5,
                callback: (val) => `$${Number(val).toFixed(2)}`
              }
            }
          }
        }
      });
    }

    // Pobieranie świeczek (k-lines) z Binance
    async function fetchKlines(symbol, interval, limit) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Błąd pobierania danych');
      return await res.json();
    }

    // Aktualna cena pojedynczej pary z tickera
    async function fetchTickerPrice(symbol) {
      const url = `https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Błąd pobierania danych');
      const data = await res.json();
      return parseClose(data.price);
    }

    // Żywy kurs ATOM/SOL liczony z bieżących cen obu aktywów
    async function fetchCurrentRatio() {
      const [atomPrice, solPrice] = await Promise.all([
        fetchTickerPrice('ATOMUSDC'),
        fetchTickerPrice('SOLUSDC')
      ]);
      if (!atomPrice || !solPrice) return null;
      return atomPrice / solPrice;
    }

    // Aktualizacja widoku i wykresu
    async function loadData(tfKey) {
      const requestId = ++loadRequest;
      loaderEl.style.display = 'block';
      const conf = TIMEFRAMES[tfKey];

      try {
        const [atomKlines, solKlines] = await Promise.all([
          fetchKlines('ATOMUSDC', conf.interval, conf.limit),
          fetchKlines('SOLUSDC', conf.interval, conf.limit)
        ]);
        if (requestId !== loadRequest) return;

        // Kursor żywego kursu: osobne zapytanie, żeby błąd tickera nie
        // unieruchamiał wykresu opartego na k-line'ach.
        fetchCurrentRatio()
          .then((ratio) => {
            if (requestId !== loadRequest || ratio === null) return;
            currentRatio = ratio;
            // Skala Y liczy się z serii świec, więc żywy kurs czasem
            // wypada poza jej zakres i linia przykleja się do krawędzi.
            const series = chartInstance.data.datasets[primaryDatasetIndex].data
              .filter((value) => Number.isFinite(value) && value > 0);
            if (series.length) {
              const lowest = Math.min(...series);
              const highest = Math.max(...series);
              if (ratio > highest) chartInstance.options.scales.y.max = ratio * 1.02;
              else if (ratio < lowest) chartInstance.options.scales.y.min = ratio * 0.98;
            }
            chartInstance.update('none');
          })
          .catch(() => {});

        const atomByTimestamp = new Map();
        const solByTimestamp = new Map();

        for (const kline of atomKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) atomByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        for (const kline of solKlines) {
          const timestamp = parseTimestamp(kline[0]);
          if (timestamp !== null) solByTimestamp.set(timestamp, parseClose(kline[4]));
        }

        const timestamps = Array.from(new Set([
          ...atomByTimestamp.keys(),
          ...solByTimestamp.keys()
        ])).sort((left, right) => left - right);
        const labels = [];
        const ratios = [];
        const atomPrices = [];
        const solPrices = [];

        for (const timestamp of timestamps) {
          const atomClose = atomByTimestamp.get(timestamp) ?? null;
          const solClose = solByTimestamp.get(timestamp) ?? null;

          labels.push(formatTimestamp(timestamp, tfKey));
          atomPrices.push(atomClose);
          solPrices.push(solClose);
          ratios.push(atomClose !== null && solClose !== null ? atomClose / solClose : null);
        }

        const lastAtom = lastValidValue(atomPrices);
        const lastDot = lastValidValue(solPrices);
        const lastAlignedRatio = currentRatio
          ?? ratios.findLast((ratio) => Number.isFinite(ratio) && ratio > 0);

        if (lastAlignedRatio !== undefined && lastAlignedRatio !== null) {
          currentRateEl.innerText = `1 ATOM = ${formatRatio(lastAlignedRatio)} SOL`;
          inverseRateEl.innerText = `1 SOL = ${formatRatio(1 / lastAlignedRatio)} ATOM`;
        } else {
          currentRateEl.innerText = 'Brak danych';
          inverseRateEl.innerText = 'Brak danych';
        }

        const atomArrow = directionArrow(lastCandleDirection(atomKlines));
        const solArrow = directionArrow(lastCandleDirection(solKlines));
        const atomPriceText = lastAtom === null ? '$--' : `$${lastAtom.toFixed(2)}`;
        const solPriceText = lastDot === null ? '$--' : `$${lastDot.toFixed(2)}`;

        subPricesEl.innerHTML = [
          `ATOM: ${atomPriceText}`,
          `<span class="arrow ${atomArrow.className}">${atomArrow.text}</span>`,
          '|',
          `SOL: ${solPriceText}`,
          `<span class="arrow ${solArrow.className}">${solArrow.text}</span>`
        ].join(' ');

        atomPriceEl.innerText = lastAtom === null ? '$--' : `$${formatUsd(lastAtom)}`;
        solPriceEl.innerText = lastDot === null ? '$--' : `$${formatUsd(lastDot)}`;

        // Skala wraca do automatycznej przy zmianie interwału, bo poprzedni
        // zakres mógł został rozszerzony pod żywy kurs.
        delete chartInstance.options.scales.y.min;
        delete chartInstance.options.scales.y.max;
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = ratios;
        chartInstance.update();

        if (atomChartInstance) {
          atomChartInstance.data.labels = labels;
          atomChartInstance.data.datasets[0].data = atomPrices;
          atomChartInstance.update();
        }

        if (solChartInstance) {
          solChartInstance.data.labels = labels;
          solChartInstance.data.datasets[0].data = solPrices;
          solChartInstance.update();
        }
      } catch (err) {
        if (requestId !== loadRequest) return;
        console.error(err);
        currentRateEl.innerText = 'Błąd pobierania';
        inverseRateEl.innerText = 'Błąd pobierania';
      } finally {
        if (requestId === loadRequest) loaderEl.style.display = 'none';
      }
    }

    // Obsługa przełączania interwałów
    document.getElementById('intervals').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#intervals button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeTf = e.target.getAttribute('data-tf');
      loadData(activeTf);
    });

    // Start
    initChart();
    atomChartInstance = initPriceChart('atomChart', '#2ea043', 'rgba(46, 160, 67, 0.12)');
    solChartInstance = initPriceChart('solChart', '#bc8cff', 'rgba(188, 140, 255, 0.12)');
    loadData(activeTf);

    // Auto-odświeżanie co 30 sekund
    setInterval(() => loadData(activeTf), 30000);
  </script>
</body>
</html>
